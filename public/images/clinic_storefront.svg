<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="nightSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#070F18"/>
      <stop offset="60%" stop-color="#0F2537"/>
      <stop offset="100%" stop-color="#1A2E40"/>
    </linearGradient>
    <linearGradient id="glowLamp" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="30%" stop-color="#FFF9D2" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#FFF3B0" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="boardBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#002B66"/>
      <stop offset="50%" stop-color="#0B57D0"/>
      <stop offset="100%" stop-color="#003580"/>
    </linearGradient>
    <linearGradient id="lightBoxBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0066FF"/>
      <stop offset="100%" stop-color="#0040A8"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Night Background -->
  <rect width="800" height="600" fill="url(#nightSky)"/>

  <!-- Street Lamp Light Cone -->
  <circle cx="720" cy="80" r="160" fill="url(#glowLamp)"/>
  <circle cx="720" cy="80" r="12" fill="#FFFFFF"/>

  <!-- Street Ground / Forecourt -->
  <rect x="0" y="440" width="800" height="160" fill="#242B35"/>
  <path d="M0 450 L800 450" stroke="#333E4D" stroke-width="3"/>

  <!-- Building Facade Structure -->
  <rect x="60" y="160" width="600" height="285" fill="#E2E8F0" stroke="#94A3B8" stroke-width="2"/>
  <!-- Upper Billboard: दांतों का अस्पताल DENTAL CLINIC -->
  <rect x="70" y="170" width="580" height="75" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
  <text x="360" y="202" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="24" fill="#0F2537" text-anchor="middle">दांतों का अस्पताल</text>
  <text x="360" y="226" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="20" fill="#DC2626" text-anchor="middle" letter-spacing="2">DENTAL CLINIC</text>
  <text x="360" y="240" font-family="'Inter', sans-serif" font-weight="600" font-size="9.5" fill="#475569" text-anchor="middle">Add: Near Masli Puliya, Balawala, Dehradun (Uk)  ✆ 7018021512</text>

  <!-- Lower Main Illuminated Clinic Board -->
  <!-- Blue Glow behind Sign -->
  <rect x="70" y="255" width="470" height="65" rx="6" fill="#0052CC" opacity="0.35" filter="url(#neonGlow)"/>
  <rect x="75" y="255" width="460" height="60" rx="4" fill="url(#boardBlue)" stroke="#38BDF8" stroke-width="2"/>

  <!-- Regd & Doctor Details on Signboard -->
  <text x="90" y="270" font-family="sans-serif" font-size="8" font-weight="bold" fill="#F8FAFC">Regd. No-4135</text>
  <text x="90" y="285" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="15" fill="#FFFFFF">UNIYAL</text>
  <text x="90" y="302" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="800" font-size="10.5" fill="#F8FAFC" letter-spacing="0.5">ORO DENTAL CLINIC &amp; IMPLANT CENTER</text>

  <!-- Doctor Badge on Signboard -->
  <rect x="420" y="260" width="105" height="50" rx="4" fill="#0A3A75" stroke="#60A5FA" stroke-width="1"/>
  <text x="472" y="273" font-family="sans-serif" font-size="7.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Dr. Ashish Uniyal</text>
  <text x="472" y="283" font-family="sans-serif" font-size="6.5" fill="#BAE6FD" text-anchor="middle">(Oral &amp; Dental Surgeon)</text>
  <text x="472" y="295" font-family="sans-serif" font-size="7.5" font-weight="bold" fill="#FDE047" text-anchor="middle">Dr. Ashish Lakhera</text>
  <text x="472" y="305" font-family="sans-serif" font-size="6.5" fill="#BAE6FD" text-anchor="middle">(Consultant Surgeon)</text>

  <!-- Clinic Glass Entrance & Posters -->
  <rect x="130" y="325" width="280" height="120" fill="#F8FAFC" stroke="#94A3B8" stroke-width="3"/>
  <rect x="135" y="330" width="130" height="110" fill="#E0F2FE" stroke="#BAE6FD" stroke-width="1.5"/>
  <!-- Treatment Poster Simulation -->
  <rect x="145" y="340" width="110" height="40" fill="#0284C7"/>
  <text x="200" y="364" font-family="sans-serif" font-size="9" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Dental Implants &amp; RCT</text>
  <!-- Glass Door with "Welcome To DENTAL CLINIC" -->
  <rect x="270" y="330" width="135" height="110" fill="#FFFFFF" stroke="#0D9488" stroke-width="2"/>
  <text x="337" y="360" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="10" fill="#0284C7" text-anchor="middle">Welcome To</text>
  <text x="337" y="375" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="13" fill="#0F2537" text-anchor="middle">DENTAL CLINIC</text>
  <circle cx="337" cy="405" r="16" fill="#E6FFFA" stroke="#0D9488" stroke-width="1.5"/>
  <text x="337" y="410" font-size="14" text-anchor="middle">🦷</text>

  <!-- Vertical Roadside Pylon Signboard (Right Side Near Pole) -->
  <!-- Glowing Neon Blue Box -->
  <rect x="610" y="240" width="110" height="150" rx="8" fill="#0066FF" opacity="0.4" filter="url(#neonGlow)"/>
  <rect x="615" y="245" width="100" height="140" rx="6" fill="url(#lightBoxBlue)" stroke="#93C5FD" stroke-width="3"/>
  <text x="665" y="285" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="20" fill="#FFFFFF" text-anchor="middle">दांतों</text>
  <text x="665" y="315" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="18" fill="#FFFFFF" text-anchor="middle">का</text>
  <text x="665" y="348" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="19" fill="#FFFFFF" text-anchor="middle">अस्पताल</text>
  <text x="665" y="372" font-family="sans-serif" font-weight="bold" font-size="9" fill="#FEF08A" text-anchor="middle">✆ 7018021512</text>

  <!-- Lower Roadside Board: उनियाल डेन्टल क्लीनिक -->
  <rect x="615" y="405" width="105" height="110" rx="4" fill="#0F172A" stroke="#475569" stroke-width="2"/>
  <text x="667" y="426" font-family="sans-serif" font-weight="900" font-size="10" fill="#FFFFFF" text-anchor="middle">उनियाल डेन्टल क्लीनिक</text>
  <text x="667" y="440" font-family="sans-serif" font-size="7.5" fill="#38BDF8" text-anchor="middle">Dr. Ashish Uniyal</text>
  <text x="667" y="452" font-family="sans-serif" font-size="7" fill="#FBBF24" text-anchor="middle">9:30 AM - 1:00 PM | 4:00 - 9:00 PM</text>
  <text x="667" y="470" font-family="sans-serif" font-weight="bold" font-size="8.5" fill="#EF4444" text-anchor="middle">✆ 7018021512</text>

  <!-- Electric Pole -->
  <rect x="730" y="0" width="16" height="520" fill="#4B5563"/>
  <line x1="720" y1="90" x2="665" y2="245" stroke="#1E293B" stroke-width="2"/>
  <line x1="0" y1="140" x2="800" y2="170" stroke="#0F172A" stroke-width="1.5"/>
  <line x1="0" y1="120" x2="800" y2="150" stroke="#0F172A" stroke-width="1.5"/>

  <!-- Patient Scooters Parked Outside -->
  <g transform="translate(480, 420)">
    <circle cx="20" cy="50" r="14" fill="#1E293B" stroke="#64748B" stroke-width="3"/>
    <circle cx="65" cy="50" r="14" fill="#1E293B" stroke="#64748B" stroke-width="3"/>
    <path d="M20 50 L35 30 L55 30 L65 50" fill="none" stroke="#0F172A" stroke-width="6"/>
    <rect x="40" y="24" width="22" height="10" rx="3" fill="#334155"/>
    <path d="M30 20 L40 32" stroke="#64748B" stroke-width="4"/>
  </g>
</svg>
