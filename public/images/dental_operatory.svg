<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="wallStripes" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>
    <linearGradient id="marbleCabinet" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="50%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>
    <linearGradient id="counterTop" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2D1810"/>
      <stop offset="50%" stop-color="#4A2818"/>
      <stop offset="100%" stop-color="#2D1810"/>
    </linearGradient>
    <linearGradient id="surgicalLightGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7A00" stop-opacity="0.95"/>
      <stop offset="40%" stop-color="#FF9E00" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#FFAA00" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background Wall with Signature Chevron Striped Wallpaper -->
  <rect width="800" height="600" fill="url(#wallStripes)"/>
  <g opacity="0.14" stroke="#64748B" stroke-width="2">
    <path d="M50 0 L70 600 M120 0 L140 600 M190 0 L210 600 M260 0 L280 600 M330 0 L350 600 M400 0 L420 600 M470 0 L490 600 M540 0 L560 600 M610 0 L630 600 M680 0 L700 600 M750 0 L770 600"/>
  </g>

  <!-- Wall-mounted Blue Star Air Conditioner -->
  <rect x="240" y="30" width="160" height="65" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
  <rect x="250" y="75" width="140" height="12" rx="3" fill="#E2E8F0"/>
  <text x="270" y="52" font-family="sans-serif" font-size="7" font-weight="bold" fill="#0284C7">BLUE STAR</text>

  <!-- Framed Doctor Degrees & Certificates on Wall -->
  <rect x="20" y="70" width="70" height="90" rx="3" fill="#451A03" stroke="#D97706" stroke-width="2"/>
  <rect x="26" y="76" width="58" height="78" fill="#FFFBEB"/>
  <rect x="98" y="90" width="65" height="50" rx="3" fill="#B45309" stroke="#FDE68A" stroke-width="1.5"/>
  <rect x="103" y="95" width="55" height="40" fill="#FFFBEB"/>
  <rect x="20" y="170" width="70" height="85" rx="3" fill="#451A03" stroke="#D97706" stroke-width="2"/>
  <rect x="98" y="150" width="65" height="70" rx="3" fill="#1E293B" stroke="#CBD5E1" stroke-width="1.5"/>

  <!-- Clinic Water Purifier Unit on Wall -->
  <rect x="420" y="130" width="60" height="75" rx="5" fill="#FFFFFF" stroke="#0284C7" stroke-width="2"/>
  <rect x="428" y="140" width="44" height="25" fill="#E0F2FE"/>

  <!-- Granite/Marble Workstation Countertop & Cabinetry (Left) -->
  <rect x="0" y="270" width="360" height="30" fill="url(#counterTop)"/>
  <rect x="0" y="300" width="360" height="260" fill="url(#marbleCabinet)" stroke="#94A3B8" stroke-width="2"/>
  <!-- Marble veins & Drawer Handles -->
  <line x1="0" y1="365" x2="360" y2="365" stroke="#1E293B" stroke-width="3"/>
  <line x1="0" y1="435" x2="360" y2="435" stroke="#1E293B" stroke-width="3"/>
  <line x1="0" y1="505" x2="360" y2="505" stroke="#1E293B" stroke-width="3"/>
  <!-- Computer Monitor & CPU on Counter -->
  <rect x="240" y="210" width="90" height="60" rx="4" fill="#0F172A" stroke="#475569" stroke-width="2"/>
  <rect x="245" y="215" width="80" height="50" fill="#1E3A5F"/>
  <rect x="200" y="210" width="32" height="60" rx="2" fill="#0F172A"/>

  <!-- High-Tech Articulated Dental Light (Orange Lamp Beam Illuminating Operatory Field) -->
  <g transform="translate(480, 110)">
    <!-- Arm -->
    <path d="M-80 -20 L0 30 L50 80" stroke="#CBD5E1" stroke-width="14" fill="none" stroke-linecap="round"/>
    <!-- Light Housing -->
    <ellipse cx="60" cy="90" rx="30" ry="20" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2"/>
    <ellipse cx="60" cy="90" rx="22" ry="14" fill="#EA580C"/>
    <!-- Orange Glow Focused Downward on Treatment Field -->
    <polygon points="45,100 0,380 180,380 75,100" fill="url(#surgicalLightGlow)"/>
  </g>

  <!-- Fully Reclined Dental Chair & Patient -->
  <g transform="translate(380, 290)">
    <!-- Dental Chair Frame -->
    <rect x="30" y="100" width="340" height="65" rx="16" fill="#CBD5E1" stroke="#94A3B8" stroke-width="2"/>
    <path d="M120 165 L180 280 L280 280 L240 165 Z" fill="#E2E8F0" stroke="#94A3B8" stroke-width="2"/>
    
    <!-- Reclined Patient Covered in Sterile Green Surgical Drape -->
    <!-- Head in Headrest -->
    <circle cx="50" cy="95" r="28" fill="#F0C7A6"/>
    <!-- Patient Torso in Green Apron/Drape -->
    <path d="M65 95 C110 95 180 100 240 105 L240 155 L65 155 Z" fill="#0D9488" stroke="#0F766E" stroke-width="2"/>
    <!-- Patient Denim Jeans & Legs extending on chair -->
    <path d="M235 105 L350 115 L350 155 L235 155 Z" fill="#1E3A8A"/>
    <!-- Patient Shoes/Socks at end of chair -->
    <ellipse cx="355" cy="130" rx="15" ry="20" fill="#0F172A"/>
  </g>

  <!-- Doctor Performing Micro-Procedure (Focused Precision with Dental Handpiece) -->
  <g transform="translate(350, 240)">
    <!-- Doctor Body in Navy Scrubs -->
    <path d="M50 80 C20 110 0 170 -10 240 L100 240 C90 170 80 110 50 80 Z" fill="#1E3A8A"/>
    <!-- White doctor nametag / embroidery: Dr. Ashish Uniyal Dental Surgeon -->
    <rect x="15" y="130" width="38" height="14" rx="2" fill="#FFFFFF" opacity="0.85"/>
    <text x="34" y="140" font-family="sans-serif" font-size="5" font-weight="bold" fill="#0F172A" text-anchor="middle">Dr. Ashish</text>

    <!-- Head leaning forward with black surgical mask and safety glasses -->
    <ellipse cx="65" cy="40" rx="32" ry="38" fill="#E2B18E"/>
    <!-- Black Hair -->
    <path d="M35 30 C35 -5 65 -15 95 -5 C95 20 90 35 85 45 C75 30 50 30 35 30 Z" fill="#0F172A"/>
    <!-- Black Medical Face Mask Covering Mouth & Nose -->
    <path d="M42 35 C42 65 88 65 88 35 Z" fill="#18181B" stroke="#27272A" stroke-width="1.5"/>
    <!-- Safety Eyeglasses -->
    <circle cx="58" cy="30" r="10" fill="none" stroke="#0F172A" stroke-width="2"/>
    <circle cx="78" cy="30" r="10" fill="none" stroke="#0F172A" stroke-width="2"/>

    <!-- Doctor's Arms with White Sterile Latex Gloves Operating Handpiece -->
    <path d="M20 120 L75 125 L95 105" stroke="#1E3A8A" stroke-width="28" stroke-linecap="round" fill="none"/>
    <!-- Glove Hand & Dental Handpiece Tool emitting precision micro-water spray -->
    <ellipse cx="98" cy="100" rx="12" ry="9" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <line x1="98" y1="100" x2="115" y2="92" stroke="#CBD5E1" stroke-width="4"/>
    <circle cx="116" cy="91" r="3" fill="#38BDF8"/>
  </g>

  <!-- Surgical Tray with Instruments (Foreground) -->
  <g transform="translate(340, 420)">
    <rect x="0" y="0" width="190" height="95" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
    <rect x="6" y="6" width="178" height="83" rx="6" fill="#0D9488" opacity="0.2"/>
    <!-- Sterile Instrument Packets & Medicaments -->
    <rect x="15" y="15" width="50" height="30" rx="3" fill="#FFFFFF" stroke="#94A3B8"/>
    <rect x="75" y="15" width="40" height="25" rx="3" fill="#FFFFFF" stroke="#94A3B8"/>
    <!-- Antiseptic Spray & Saline Solution Bottle -->
    <rect x="140" y="10" width="22" height="50" rx="4" fill="#BAE6FD" stroke="#0284C7" stroke-width="1.5"/>
    <rect x="165" y="20" width="18" height="40" rx="3" fill="#A7F3D0" stroke="#059669" stroke-width="1.5"/>
  </g>

  <!-- Lower Operatory Quality Tag -->
  <rect x="40" y="525" width="420" height="50" rx="12" fill="#0F2537" opacity="0.95"/>
  <text x="60" y="555" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="13" fill="#FFFFFF">Operatory &amp; Sterilization Standards</text>
  <text x="290" y="555" font-family="'Inter', sans-serif" font-weight="bold" font-size="10" fill="#38BDF8">Rotary RCT &amp; 3D Implantology</text>
</svg>
