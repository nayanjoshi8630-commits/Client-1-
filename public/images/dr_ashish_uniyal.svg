<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" width="100%" height="100%">
  <defs>
    <linearGradient id="wallPattern" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>
    <linearGradient id="shirtBrown" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#B2875C"/>
      <stop offset="100%" stop-color="#8B623E"/>
    </linearGradient>
    <linearGradient id="girlSweater" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="100%" stop-color="#FDE047"/>
    </linearGradient>
  </defs>

  <!-- Clinic Background with Vertical Silver-Grey Chevron Striped Wallpaper -->
  <rect width="600" height="750" fill="url(#wallPattern)"/>
  <g opacity="0.18" stroke="#64748B" stroke-width="2.5">
    <path d="M50 0 L70 750 M120 0 L140 750 M190 0 L210 750 M260 0 L280 750 M330 0 L350 750 M400 0 L420 750 M470 0 L490 750 M540 0 L560 750"/>
    <path d="M40 0 L60 200 L40 400 L60 600 L40 750 M160 0 L180 200 L160 400 L180 600 M280 0 L300 200 L280 400 L300 600 M400 0 L420 200 L400 400 L420 600 M520 0 L540 200 L520 400 L540 600"/>
  </g>

  <!-- Modern Dental Operatory Equipment in Background -->
  <!-- Overhead Dental Light & Articulated Arm -->
  <path d="M120 120 L380 140 L450 160" stroke="#94A3B8" stroke-width="14" fill="none" stroke-linecap="round"/>
  <rect x="150" y="105" width="280" height="24" rx="4" fill="#E2E8F0" stroke="#CBD5E1" stroke-width="2"/>
  <circle cx="440" cy="165" r="28" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="3"/>
  <path d="M420 150 C450 130 480 150 480 180 C460 200 420 180 420 150 Z" fill="#E2E8F0"/>

  <!-- Dental Chair Spittoon and Utility console -->
  <ellipse cx="500" cy="380" rx="45" ry="18" fill="#1E293B"/>
  <rect x="470" y="390" width="60" height="180" fill="#E2E8F0" stroke="#CBD5E1" stroke-width="2"/>
  <rect x="380" y="240" width="65" height="75" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
  <text x="412" y="275" font-family="monospace" font-size="14" fill="#EF4444" font-weight="bold" text-anchor="middle">0.20</text>

  <!-- Dr. Ashish Uniyal (Left - Smiling in Brown Ribbed Button Shirt with Mask around Chin) -->
  <g transform="translate(10, 80)">
    <!-- Doctor Body & Tan Shirt -->
    <path d="M60 420 C60 300 120 270 190 270 C260 270 320 300 320 420 L320 670 L60 670 Z" fill="url(#shirtBrown)"/>
    <!-- Collar & Buttons -->
    <path d="M150 270 L190 320 L230 270" stroke="#78350F" stroke-width="3" fill="#D97706" opacity="0.3"/>
    <line x1="190" y1="320" x2="190" y2="440" stroke="#78350F" stroke-width="2.5"/>

    <!-- Doctor Neck & Face -->
    <path d="M165 240 L165 280 L215 280 L215 240 Z" fill="#E2B18E"/>
    <!-- Chin Surgical Mask pulled down -->
    <path d="M155 245 C155 270 225 270 225 245 C225 240 155 240 155 245 Z" fill="#93C5FD" stroke="#60A5FA" stroke-width="1.5"/>
    <path d="M155 245 C150 215 155 180 160 170" stroke="#60A5FA" stroke-width="1.5" fill="none"/>
    <path d="M225 245 C230 215 225 180 220 170" stroke="#60A5FA" stroke-width="1.5" fill="none"/>

    <!-- Face Shape -->
    <ellipse cx="190" cy="180" rx="52" ry="60" fill="#F0C7A6"/>

    <!-- Styled Dark Hair & Neat Beard -->
    <!-- Beard & Stache -->
    <path d="M155 180 C155 230 225 230 225 180 C215 195 200 200 190 200 C180 200 165 195 155 180 Z" fill="#1C1917"/>
    <!-- Smile & Teeth -->
    <path d="M175 188 Q190 200 205 188" stroke="#1C1917" stroke-width="2" fill="none"/>
    <path d="M178 189 Q190 196 202 189" fill="#FFFFFF"/>

    <!-- Eyes and Eyeglasses -->
    <!-- Stylish Spectacles -->
    <rect x="156" y="152" width="30" height="22" rx="6" fill="none" stroke="#0F172A" stroke-width="2.5"/>
    <rect x="194" y="152" width="30" height="22" rx="6" fill="none" stroke="#0F172A" stroke-width="2.5"/>
    <line x1="186" y1="162" x2="194" y2="162" stroke="#0F172A" stroke-width="2.5"/>
    <!-- Pupils -->
    <circle cx="171" cy="163" r="3.5" fill="#1C1917"/>
    <circle cx="209" cy="163" r="3.5" fill="#1C1917"/>
    <!-- Hair Volume -->
    <path d="M135 160 C135 100 170 80 205 85 C240 85 255 110 250 160 C240 145 230 140 220 145 C200 135 170 135 150 145 C140 150 135 155 135 160 Z" fill="#1C1917"/>

    <!-- Right Arm in Latex Glove (Thumbs Up Supporting Patient) -->
    <path d="M250 360 C280 390 300 450 310 500" stroke="url(#shirtBrown)" stroke-width="40" stroke-linecap="round" fill="none"/>
    <!-- White Sterile Glove with Thumbs Up -->
    <g transform="translate(290, 480)">
      <circle cx="20" cy="20" r="16" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2"/>
      <path d="M15 25 L15 5 C15 0 25 0 25 5 L25 25 Z" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
    </g>
  </g>

  <!-- Cheerful Young Child Patient (Right - Leaning in Dental Chair Giving Enthusiastic Thumbs-Up) -->
  <g transform="translate(240, 220)">
    <!-- Dental Reclining Chair Seat Back -->
    <rect x="70" y="240" width="260" height="260" rx="30" fill="#E2E8F0" stroke="#CBD5E1" stroke-width="4"/>

    <!-- Little Girl Pink Wool Beanie Cap -->
    <path d="M90 140 C90 90 160 90 160 140 Z" fill="#F43F5E"/>
    <rect x="85" y="130" width="80" height="15" rx="5" fill="#BE123C"/>

    <!-- Radiant Smile & Face -->
    <ellipse cx="125" cy="165" rx="32" ry="34" fill="#E8B896"/>
    <!-- Big Sparkling Child Smile -->
    <path d="M108 172 Q125 195 142 172 Z" fill="#FFFFFF" stroke="#9F1239" stroke-width="2"/>
    <!-- Sparkle on Healthy White Teeth -->
    <text x="125" y="184" font-size="12" text-anchor="middle">😁</text>
    <!-- Rosy Cheeks -->
    <circle cx="106" cy="168" r="6" fill="#FB7185" opacity="0.6"/>
    <circle cx="144" cy="168" r="6" fill="#FB7185" opacity="0.6"/>
    <!-- Happy Eyes -->
    <path d="M110 156 Q116 150 122 156" stroke="#4C1D95" stroke-width="2.5" fill="none"/>
    <path d="M128 156 Q134 150 140 156" stroke="#4C1D95" stroke-width="2.5" fill="none"/>

    <!-- Cozy Warm Yellow Winter Sweater -->
    <path d="M95 195 C75 220 70 300 80 360 L200 360 C210 300 205 220 185 195 Z" fill="url(#girlSweater)"/>

    <!-- Child's Energetic Big Thumbs Up Gesture -->
    <!-- Arm in Yellow Sleeve Extending Forward -->
    <path d="M175 230 L220 170" stroke="url(#girlSweater)" stroke-width="32" stroke-linecap="round"/>
    <g transform="translate(225, 120)">
      <!-- Hand & High Thumb -->
      <ellipse cx="15" cy="40" rx="14" ry="12" fill="#E8B896"/>
      <!-- Thumbs Up -->
      <path d="M10 40 L10 10 C10 4 20 4 20 10 L20 40 Z" fill="#E8B896" stroke="#C27D56" stroke-width="1.5"/>
      <circle cx="15" cy="8" r="5" fill="#E8B896"/>
    </g>
  </g>

  <!-- Bottom Badge: Dr. Ashish Uniyal & Patient Pediatric Trust -->
  <rect x="30" y="660" width="540" height="65" rx="16" fill="#0F2537" opacity="0.95"/>
  <circle cx="65" cy="692" r="18" fill="#E6FFFA"/>
  <text x="65" y="698" font-size="18" text-anchor="middle">⭐</text>
  <text x="100" y="686" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="14" fill="#FFFFFF">Gentle Pediatric Dental Experience</text>
  <text x="100" y="704" font-family="'Inter', sans-serif" font-weight="600" font-size="11" fill="#38BDF8">Dr. Ashish Uniyal with a happy, pain-free young patient at Balawala Clinic</text>
</svg>
