<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="suiteWall" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>
    <linearGradient id="chairGreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#84CC16"/>
      <stop offset="100%" stop-color="#65A30D"/>
    </linearGradient>
    <linearGradient id="floorMat" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#991B1B"/>
      <stop offset="100%" stop-color="#B91C1C"/>
    </linearGradient>
  </defs>

  <!-- Operatory Room with Chevron Striped Wallpaper -->
  <rect width="800" height="600" fill="url(#suiteWall)"/>
  <g opacity="0.14" stroke="#64748B" stroke-width="2">
    <path d="M50 0 L70 600 M110 0 L130 600 M170 0 L190 600 M230 0 L250 600 M290 0 L310 600 M350 0 L370 600 M410 0 L430 600 M470 0 L490 600 M530 0 L550 600 M590 0 L610 600 M650 0 L670 600 M710 0 L730 600 M770 0 L790 600"/>
  </g>

  <!-- Flooring: Clean Speckled Clinic Terrazzo Floor -->
  <rect x="0" y="380" width="800" height="220" fill="#CBD5E1"/>
  <!-- Red Non-Slip Protective Floor Mat under Chair -->
  <rect x="440" y="440" width="270" height="150" rx="10" fill="url(#floorMat)"/>

  <!-- Wall Elements: Blue Star Air Conditioner & Certificate Frames -->
  <rect x="330" y="25" width="130" height="48" rx="4" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="350" y="42" font-family="sans-serif" font-size="6" font-weight="bold" fill="#0284C7">BLUE STAR</text>

  <!-- Degrees / Certificates Wall (4 Frames) -->
  <rect x="230" y="70" width="35" height="45" fill="#451A03" stroke="#D97706" stroke-width="1"/>
  <rect x="270" y="70" width="35" height="45" fill="#B45309" stroke="#FDE68A" stroke-width="1"/>
  <rect x="230" y="125" width="35" height="45" fill="#451A03" stroke="#D97706" stroke-width="1"/>
  <rect x="270" y="125" width="35" height="45" fill="#1E293B" stroke="#CBD5E1" stroke-width="1"/>

  <!-- Consultation Doctor Desk & Executive Chair (Left) -->
  <!-- Black Glossy Consultation Desk with Glass Top -->
  <rect x="40" y="280" width="270" height="200" rx="4" fill="#0F172A" stroke="#334155" stroke-width="2"/>
  <rect x="45" y="285" width="260" height="15" fill="#1E293B"/>
  <!-- Decorative Pink Floral Vase on Desk (foreground left) -->
  <g transform="translate(10, 420)">
    <circle cx="50" cy="90" r="30" fill="#FFFFFF" stroke="#CBD5E1"/>
    <!-- Vibrant Pink Silk Flowers & Green Foliage -->
    <circle cx="35" cy="50" r="14" fill="#F43F5E"/>
    <circle cx="55" cy="40" r="16" fill="#FB7185"/>
    <circle cx="70" cy="55" r="15" fill="#E11D48"/>
    <circle cx="45" cy="25" r="12" fill="#FDA4AF"/>
    <path d="M25 60 C35 70 45 80 50 90" stroke="#16A34A" stroke-width="3"/>
    <path d="M60 55 C55 70 52 80 50 90" stroke="#16A34A" stroke-width="3"/>
  </g>

  <!-- Patient Consultation Chairs (Magenta / Purple Fabric) -->
  <rect x="145" y="240" width="90" height="110" rx="14" fill="#831843" stroke="#701A75" stroke-width="2"/>
  <rect x="35" y="320" width="100" height="120" rx="16" fill="#831843" stroke="#701A75" stroke-width="2"/>

  <!-- Background Marble Cabinet & Computer Terminal -->
  <rect x="240" y="250" width="180" height="120" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <rect x="375" y="210" width="45" height="35" rx="3" fill="#0F172A"/>

  <!-- Modern White & Apple-Green Dental Chair Suite (Right) -->
  <g transform="translate(460, 240)">
    <!-- Base Hydraulic Pedestal -->
    <path d="M70 240 L160 240 L180 290 L50 290 Z" fill="#F8FAFC" stroke="#94A3B8" stroke-width="3"/>
    
    <!-- Distinctive Apple-Green Reclined Dental Patient Cushion -->
    <rect x="50" y="160" width="220" height="42" rx="14" fill="url(#chairGreen)" stroke="#4D7C0F" stroke-width="2"/>
    <!-- Headrest with Pillow -->
    <rect x="10" y="162" width="40" height="36" rx="8" fill="#FACC15" stroke="#CA8A04" stroke-width="2"/>

    <!-- Elderly Patient Reclining Comfortably in Striped Shawl / Blanket -->
    <path d="M50 150 C90 145 160 145 220 160 L220 185 L50 185 Z" fill="#BE185D" stroke="#831843" stroke-width="2"/>
    <!-- Warm Striped Pattern -->
    <line x1="70" y1="148" x2="70" y2="185" stroke="#FFFFFF" stroke-width="2" opacity="0.6"/>
    <line x1="90" y1="147" x2="90" y2="185" stroke="#FFFFFF" stroke-width="2" opacity="0.6"/>
    <line x1="110" y1="147" x2="110" y2="185" stroke="#FFFFFF" stroke-width="2" opacity="0.6"/>
    <line x1="130" y1="148" x2="130" y2="185" stroke="#FFFFFF" stroke-width="2" opacity="0.6"/>
    <line x1="150" y1="150" x2="150" y2="185" stroke="#FFFFFF" stroke-width="2" opacity="0.6"/>
    <line x1="170" y1="153" x2="170" y2="185" stroke="#FFFFFF" stroke-width="2" opacity="0.6"/>
    <line x1="190" y1="156" x2="190" y2="185" stroke="#FFFFFF" stroke-width="2" opacity="0.6"/>
    <!-- Bare Feet Resting Peacefully at Chair End -->
    <ellipse cx="230" cy="170" rx="14" ry="18" fill="#F0C7A6"/>

    <!-- Doctor Seated at Chairside in Black Scrubs Administering Gentle Care -->
    <path d="M-15 90 C-30 130 -40 170 -40 220 L30 220 C30 170 15 130 -15 90 Z" fill="#18181B"/>
    <circle cx="-15" cy="65" r="22" fill="#E2B18E"/>
    <path d="M-30 60 C-30 40 -10 35 5 45 C5 60 -5 75 -15 75 Z" fill="#0F172A"/>
    <!-- Black Mask -->
    <rect x="-26" y="65" width="22" height="15" rx="3" fill="#27272A"/>

    <!-- Articulated Dental Light Illuminating Oral Field -->
    <path d="M70 -80 L60 0 L15 50" stroke="#CBD5E1" stroke-width="12" fill="none" stroke-linecap="round"/>
    <ellipse cx="10" cy="60" rx="28" ry="18" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2"/>
    <ellipse cx="10" cy="60" rx="18" ry="10" fill="#EA580C"/>
    <!-- Light Beam -->
    <polygon points="5,68 -5,145 35,145 20,68" fill="#FFAA00" opacity="0.4"/>

    <!-- Chairside Mobile Delivery Instrument Tray -->
    <rect x="-60" y="140" width="100" height="35" rx="5" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
    <line x1="-10" y1="175" x2="-10" y2="240" stroke="#94A3B8" stroke-width="4"/>
  </g>

  <!-- Bottom Informative Overlay Card -->
  <rect x="40" y="525" width="720" height="52" rx="14" fill="#0F2537" opacity="0.95"/>
  <text x="65" y="555" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="14" fill="#FFFFFF">Full Clinical Operatory Suite</text>
  <text x="260" y="555" font-family="'Inter', sans-serif" font-size="11" fill="#38BDF8">Private Air-Conditioned Consultation Chamber &amp; Ergonomic Treatment Station</text>
</svg>
